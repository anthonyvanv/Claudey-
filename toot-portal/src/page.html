<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Toot Trays · Prince Fabrication</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--blue:#0071e3;--blue2:#0077ed;
  --green:#1f9d55;--orange:#c46a00;--red:#d70015;--r:18px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 120px}
.hidden{display:none!important}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:360px;text-align:center}
.login h1{font-size:32px;letter-spacing:-.02em;margin:0 0 6px}
.login p{color:var(--sub);margin:0 0 28px}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;outline:none;transition:border .15s,box-shadow .15s}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
.btn{appearance:none;border:0;border-radius:980px;background:var(--blue);color:#fff;padding:13px 22px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--blue2)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%;margin-top:14px}
.btn.ghost{background:rgba(0,113,227,.1);color:var(--blue)}
.btn.plain{background:#e8e8ed;color:var(--ink)}
.btn.small{padding:8px 14px;font-size:15px}
.err{color:var(--red);font-size:15px;min-height:22px;margin-top:10px}

/* Header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:12px 0 22px}
header h1{font-size:34px;letter-spacing:-.025em;margin:0;line-height:1.1}
header .by{color:var(--sub);font-size:15px;margin-top:4px}
.seg{display:inline-flex;background:#e8e8ed;border-radius:10px;padding:2px;margin-bottom:16px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:15px;color:var(--ink);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}

/* Order cards */
.list{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
@media(min-width:700px){.list{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}}
.tile{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.tile:hover{box-shadow:0 10px 30px rgba(0,0,0,.09);transform:translateY(-2px)}
.tile:active{transform:scale(.985)}
.cover{aspect-ratio:4/3;background:#ececf0;display:grid;gap:2px;overflow:hidden}
.cover.n2{grid-template-columns:1fr 1fr}
.cover.n3,.cover.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.cover.n3 img:first-child{grid-row:span 2}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .noart{display:grid;place-items:center;color:var(--sub);font-size:14px}
.tile .tbody{padding:12px 14px 14px}
.tile .num{font-size:16px}
.tile .meta{font-size:13px;margin-top:2px}
.tile .pill{display:inline-block;margin-top:8px;font-size:12px;padding:3px 9px}
.tile .warn{font-size:12px;margin-top:6px}
@media(min-width:700px){.tile .num{font-size:18px}.tile .meta{font-size:14px}.tile .tbody{padding:14px 18px 18px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.07)}
.card:active{transform:scale(.995)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-weight:600;font-size:19px;letter-spacing:-.01em}
.meta{color:var(--sub);font-size:15px;margin-top:4px}
.lines{margin-top:10px;font-size:15px;color:var(--ink)}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:980px;white-space:nowrap}
.s-received{background:#eef4ff;color:var(--blue)}
.s-in_production{background:#fff4e5;color:var(--orange)}
.s-complete{background:#e9f7ef;color:var(--green)}
.s-canceled{background:#f2f2f2;color:var(--sub)}
.warn{color:var(--orange);font-size:14px;margin-top:8px;font-weight:500}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 20px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 8px 30px rgba(0,113,227,.35);padding:15px 28px;font-size:17px;z-index:5}
.fab:active{transform:translateX(-50%) scale(.98)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:11;padding:0 0 max(28px,env(safe-area-inset-bottom))}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{left:50%;right:auto;width:680px;bottom:auto;top:50%;border-radius:22px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .3s,opacity .2s;max-height:88vh}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.sheet-head{position:sticky;top:0;background:rgba(245,245,247,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;z-index:2;border-bottom:1px solid rgba(0,0,0,.06)}
.sheet-head h2{font-size:17px;margin:0;font-weight:600}
.link{background:none;border:0;color:var(--blue);font-size:17px;cursor:pointer;padding:4px}
.link.bold{font-weight:600}
.sheet-body{padding:18px}
.group{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:22px}
.group .cell{padding:13px 16px;border-bottom:1px solid var(--line)}
.group .cell:last-child{border-bottom:0}
.gtitle{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;margin:0 16px 7px}
.cell label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.cell input,.cell select,.cell textarea{width:100%;border:0;outline:none;background:none;padding:2px 0}
.cell textarea{min-height:70px;resize:vertical}
.item{background:#fff;border-radius:14px;padding:4px 0;margin-bottom:12px;position:relative}
.item .cell{padding:11px 16px;border-bottom:1px solid var(--line)}
.item .cell:last-child{border-bottom:0}
.two{display:grid;grid-template-columns:1fr 90px;gap:0}
.two .cell:first-child{border-right:1px solid var(--line)}
.remove{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--red);font-size:14px;cursor:pointer;z-index:1}
.cell label.drop,.drop{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--blue);font-size:15px;margin:0}
.drop input{display:none}
.thumb{width:44px;height:44px;border-radius:9px;background:#f0f0f3 center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:11px;color:var(--sub);font-weight:600}
.addline{width:100%;margin-bottom:22px}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:600;padding:4px 4px 0}
.totalnote{color:var(--sub);font-size:14px;padding:2px 4px 18px}

/* Detail */
.status-track{display:flex;gap:6px;margin:4px 0 22px}
.status-track div{flex:1;text-align:center;font-size:13px;color:var(--sub)}
.status-track div::before{content:"";display:block;height:5px;border-radius:5px;background:#e3e3e8;margin-bottom:7px}
.status-track div.done{color:var(--ink);font-weight:600}
.status-track div.done::before{background:var(--blue)}
.status-track.complete div.done::before{background:var(--green)}
.file{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.file:last-child{border-bottom:0}
.file .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.file .fsub{color:var(--sub);font-size:13px}
.hist{padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border-bottom:0}
.hist .when{color:var(--sub);font-size:13px}
.hist .msg{white-space:pre-wrap;margin-top:2px}
.ownerbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.hero{display:block;width:100%;max-height:420px;object-fit:contain;background:#f0f0f3;border:0;border-bottom:1px solid var(--line)}
iframe.hero{height:420px;background:#fff}
.hero-wrap{position:relative;display:block}
.hero-open{position:absolute;right:10px;bottom:10px;background:rgba(29,29,31,.72);color:#fff;font-size:13px;padding:5px 11px;border-radius:980px;text-decoration:none;backdrop-filter:blur(8px)}
.thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#f0f0f3;flex:none}
.preview{display:block;width:100%;max-height:260px;object-fit:contain;background:#f0f0f3;border-radius:10px;margin-top:10px}
.editlink{background:none;border:0;color:var(--blue);font-size:15px;cursor:pointer;padding:0 0 0 10px}
.editor .cell input,.editor .cell select{font-size:17px}
.editor .acts{display:flex;gap:8px;padding:12px 16px}
.removed{opacity:.5}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-140%);background:rgba(29,29,31,.92);color:#fff;padding:11px 18px;border-radius:980px;font-size:15px;transition:transform .3s;z-index:20}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form class="box" id="loginForm">
    <h1>Toot Trays</h1>
    <p>Orders with Prince Fabrication</p>
    <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="btn full" type="submit">Sign In</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <header>
      <div>
        <h1>Orders</h1>
        <div class="by">Toot Trays × Prince Fabrication</div>
      </div>
      <button class="link" id="signout">Sign Out</button>
    </header>
    <div class="seg" id="filter">
      <button data-f="open" class="on">Open</button>
      <button data-f="complete">Complete</button>
      <button data-f="all">All</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <button class="btn fab" id="newBtn">New Order</button>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="newSheet" aria-modal="true">
  <div class="sheet-head">
    <button class="link" data-close>Cancel</button>
    <h2>New Order</h2>
    <button class="link bold" id="submitOrder">Submit</button>
  </div>
  <div class="sheet-body">
    <div class="gtitle">Trays</div>
    <div id="lines"></div>
    <button class="btn ghost addline" id="addLine">Add Another Design</button>

    <div class="gtitle">Details</div>
    <div class="group">
      <div class="cell"><label>Due date</label><input type="date" id="due"></div>
      <div class="cell"><label>Notes</label><textarea id="notes" placeholder="Anything we should know (rush, orientation, where trays are coming from)"></textarea></div>
    </div>

    <div class="gtitle">Shipping label</div>
    <div class="group">
      <div class="cell">
        <label class="drop"><span class="thumb" id="labelThumb">PDF</span><span id="labelName">Add return label (you can add it later)</span><input type="file" id="labelFile" accept="application/pdf,image/*"></label>
      </div>
    </div>

    <div class="total"><span>Total</span><span id="total">$0.00</span></div>
    <div class="totalnote">Printing only. You supply the blank trays.</div>
    <div class="err" id="newErr"></div>
  </div>
</section>

<section class="sheet" id="detailSheet" aria-modal="true">
  <div class="sheet-head">
    <span style="width:60px"></span>
    <h2 id="dTitle">Order</h2>
    <button class="link bold" data-close>Done</button>
  </div>
  <div class="sheet-body" id="dBody"></div>
</section>

<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => "$" + (Number(n) || 0).toFixed(2);
const LABEL = { received: "Received", in_production: "In production", complete: "Complete", canceled: "Canceled" };
let ME = null, ORDERS = [], FILTER = "open";

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2400); }
function fmtDate(d) { if (!d) return "No due date"; const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
function fmtWhen(iso) { return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
function isImg(f) { return /^image\//.test(f.mime || ""); }

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Please sign in."); }
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}

function showLogin() { $("#login").classList.remove("hidden"); $("#app").classList.add("hidden"); setTimeout(() => $("#pw").focus(), 50); }
async function boot() {
  try { ME = await api("/api/me"); } catch { return; }
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  load();
}

$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  try { await api("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) }); $("#pw").value = ""; boot(); }
  catch (err) { $("#loginErr").textContent = err.message; }
};
$("#signout").onclick = async () => { await fetch("/api/logout", { method: "POST" }); ME = null; showLogin(); };

$("#filter").onclick = e => { const b = e.target.closest("button"); if (!b) return; FILTER = b.dataset.f; [...$("#filter").children].forEach(x => x.classList.toggle("on", x === b)); render(); };

async function load() { ORDERS = await api("/api/orders"); render(); }
function render() {
  const list = ORDERS.filter(o => FILTER === "all" ? true : FILTER === "complete" ? o.status === "complete" : (o.status === "received" || o.status === "in_production"));
  if (!list.length) { $("#list").innerHTML = `<div class="empty">${FILTER === "open" ? "No open orders. Tap New Order to send one over." : "Nothing here yet."}</div>`; return; }
  $("#list").innerHTML = list.map(o => {
    const live = o.items.filter(i => i.qty > 0);
    const noArt = live.some(i => !i.artwork.length);
    const warn = o.status !== "complete" && o.status !== "canceled" ? [noArt ? "Artwork missing" : "", !o.labels.length ? "Label needed" : ""].filter(Boolean).join(" · ") : "";
    const imgs = live.map(i => i.artwork[i.artwork.length - 1]).filter(f => f && isImg(f)).slice(0, 4);
    const count = live.reduce((n, i) => n + i.qty, 0);
    return `<div class="card tile" data-id="${o.id}">
      <div class="cover n${imgs.length}">${imgs.length ? imgs.map(f => `<img src="${f.url}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`).join("") : `<div class="noart">No artwork yet</div>`}</div>
      <div class="tbody">
        <div class="num">Order TT ${o.id}</div>
        <div class="meta">Due ${esc(fmtDate(o.due_date))}</div>
        <div class="meta">${count} ${count === 1 ? "item" : "items"} · ${money(o.total)}</div>
        <span class="pill s-${o.status}">${LABEL[o.status]}</span>
        ${warn ? `<div class="warn">${warn}</div>` : ""}
      </div>
    </div>`;
  }).join("");
}
$("#list").onclick = e => { const c = e.target.closest(".card"); if (c) openDetail(+c.dataset.id); };

/* Sheets */
function openSheet(id) { $("#scrim").classList.add("on"); $(id).classList.add("on"); document.body.style.overflow = "hidden"; }
function closeSheets() { $("#scrim").classList.remove("on"); document.querySelectorAll(".sheet").forEach(s => s.classList.remove("on")); document.body.style.overflow = ""; }
$("#scrim").onclick = closeSheets;
document.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheets(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });

/* New order */
let LINES = [];
function newLine() { return { product: ME.products[0].key, design: "", qty: 1, file: null }; }
function drawLines() {
  $("#lines").innerHTML = LINES.map((l, i) => `
    <div class="item" data-i="${i}">
      ${LINES.length > 1 ? `<button class="remove" data-rm="${i}">Remove</button>` : ""}
      <div class="cell"><label>Design name</label><input data-k="design" value="${esc(l.design)}" placeholder="e.g. Silver Bells"></div>
      <div class="two">
        <div class="cell"><label>Product</label><select data-k="product">${ME.products.map(p => `<option value="${p.key}" ${p.key === l.product ? "selected" : ""}>${esc(p.name)} · ${money(p.price)}</option>`).join("")}</select></div>
        <div class="cell"><label>Qty</label><input data-k="qty" type="number" min="1" inputmode="numeric" value="${l.qty}"></div>
      </div>
      <div class="cell"><label class="drop"><span class="thumb" ${l.preview ? `style="background-image:url(${l.preview})"` : ""}>${l.preview ? "" : (l.file ? "FILE" : "+")}</span><span>${l.file ? esc(l.file.name) : "Add print ready artwork"}</span><input type="file" data-k="file"></label>${l.preview ? `<img class="preview" src="${l.preview}" alt="">` : ""}</div>
    </div>`).join("");
  calcTotal();
}
function calcTotal() { $("#total").textContent = money(LINES.reduce((s, l) => s + (ME.products.find(p => p.key === l.product)?.price || 0) * (Number(l.qty) || 0), 0)); }
$("#lines").addEventListener("input", e => {
  const box = e.target.closest(".item"); if (!box) return; const l = LINES[+box.dataset.i]; const k = e.target.dataset.k;
  if (k === "design") l.design = e.target.value;
  if (k === "qty") l.qty = e.target.value;
  if (k === "product") l.product = e.target.value;
  calcTotal();
});
$("#lines").addEventListener("change", e => {
  if (e.target.dataset.k !== "file") return; const l = LINES[+e.target.closest(".item").dataset.i];
  l.file = e.target.files[0] || null; l.preview = l.file && /^image\//.test(l.file.type) ? URL.createObjectURL(l.file) : null; drawLines();
});
$("#lines").addEventListener("click", e => { const rm = e.target.dataset.rm; if (rm != null) { LINES.splice(+rm, 1); drawLines(); } });
$("#addLine").onclick = () => { LINES.push(newLine()); drawLines(); };
$("#labelFile").onchange = e => { const f = e.target.files[0]; $("#labelName").textContent = f ? f.name : "Add return label (you can add it later)"; $("#labelThumb").textContent = f ? "✓" : "PDF"; };
$("#newBtn").onclick = () => {
  LINES = [newLine()]; $("#due").value = ""; $("#notes").value = ""; $("#labelFile").value = ""; $("#labelFile").onchange({ target: { files: [] } }); $("#newErr").textContent = "";
  drawLines(); openSheet("#newSheet");
};
$("#submitOrder").onclick = async () => {
  const btn = $("#submitOrder"); $("#newErr").textContent = "";
  if (LINES.some(l => !(Number(l.qty) > 0))) { $("#newErr").textContent = "Each tray needs a quantity."; return; }
  const fd = new FormData();
  fd.append("data", JSON.stringify({ due_date: $("#due").value, notes: $("#notes").value, items: LINES.map(l => ({ product: l.product, design: l.design, qty: l.qty })) }));
  LINES.forEach((l, i) => l.file && fd.append("art_" + i, l.file));
  if ($("#labelFile").files[0]) fd.append("label", $("#labelFile").files[0]);
  btn.disabled = true; btn.textContent = "Sending…";
  try { const o = await api("/api/orders", { method: "POST", body: fd }); closeSheets(); toast(`Order TT ${o.id} sent`); load(); }
  catch (err) { $("#newErr").textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = "Submit"; }
};

/* Detail */
let CUR = null;
async function openDetail(id) {
  if (!CUR || CUR.id !== id) EDITING = null;
  $("#dBody").innerHTML = `<div class="empty">Loading…</div>`; $("#dTitle").textContent = `Order TT ${id}`; openSheet("#detailSheet");
  CUR = await api("/api/orders/" + id); drawDetail();
}
function fileRow(f) {
  return `<a class="file" href="${f.url}" target="_blank" rel="noopener">
    <span class="thumb" ${isImg(f) ? `style="background-image:url(${f.url})"` : ""}>${isImg(f) ? "" : esc((f.name.split(".").pop() || "").toUpperCase().slice(0,4))}</span>
    <span class="fname">${esc(f.name)}<div class="fsub">${esc(f.uploaded_by)} · ${fmtWhen(f.uploaded_at)}</div></span></a>`;
}
function hero(f) {
  if (!f) return "";
  if (isImg(f)) return `<a class="hero-wrap" href="${f.url}" target="_blank" rel="noopener"><img class="hero" src="${f.url}" alt="${esc(f.name)}"><span class="hero-open">Open full size</span></a>`;
  if (/pdf/i.test(f.mime || "") || /\.pdf$/i.test(f.name)) return `<div class="hero-wrap"><iframe class="hero" src="${f.url}#toolbar=0&view=FitH" title="${esc(f.name)}"></iframe><a class="hero-open" href="${f.url}" target="_blank" rel="noopener">Open full size</a></div>`;
  return "";
}
let EDITING = null;
function editor(i) {
  return `<div class="editor" data-item="${i.id}">
    <div class="cell"><label>Design name</label><input class="ed-design" value="${esc(i.design || "")}" placeholder="e.g. Silver Bells"></div>
    <div class="two">
      <div class="cell"><label>Size</label><select class="ed-product">${ME.products.map(p => `<option value="${p.key}" ${p.name === i.product ? "selected" : ""}>${esc(p.name)} · ${money(p.price)}</option>`).join("")}</select></div>
      <div class="cell"><label>Qty</label><input class="ed-qty" type="number" min="0" inputmode="numeric" value="${i.qty}"></div>
    </div>
    <div class="acts"><button class="btn small" data-saveitem="${i.id}">Save</button><button class="btn small plain" data-canceledit>Cancel</button>${i.id !== "new" ? `<span class="meta" style="align-self:center;margin:0 0 0 4px">Qty 0 removes it</span>` : ""}</div>
  </div>`;
}
function drawDetail() {
  const o = CUR, s = o.status;
  const steps = ["received", "in_production", "complete"], at = steps.indexOf(s);
  $("#dBody").innerHTML = `
    ${s === "canceled" ? `<div class="warn" style="margin:0 0 18px">This order was canceled.</div>` :
      `<div class="status-track ${s === "complete" ? "complete" : ""}">${steps.map((k, i) => `<div class="${i <= at ? "done" : ""}">${LABEL[k]}</div>`).join("")}</div>`}
    ${ME.role === "owner" ? `<div class="ownerbar">
      <button class="btn small ${s === "in_production" ? "" : "plain"}" data-stage="in_production">In Production</button>
      <button class="btn small ${s === "complete" ? "" : "plain"}" data-stage="complete">Complete</button>
      ${s !== "received" ? `<button class="btn small plain" data-stage="submitted">Back to Received</button>` : ""}</div>` : ""}

    <div class="gtitle">Trays</div>
    ${o.items.map(i => `<div class="group ${i.qty === 0 ? "removed" : ""}">
      ${EDITING === i.id ? editor(i) : `<div class="cell"><div class="row"><strong>${i.qty === 0 ? "Removed: " : i.qty + " × "}${esc(i.product)}</strong><span>${money(i.unit_price * i.qty)}<button class="editlink" data-edit="${i.id}">Edit</button></span></div>${i.design ? `<div class="meta" style="margin:2px 0 0">${esc(i.design)}</div>` : ""}</div>`}
      ${hero(i.artwork[i.artwork.length - 1])}
      ${i.artwork.length ? i.artwork.slice().reverse().map(fileRow).join("") : `<div class="cell warn" style="margin:0">No artwork yet</div>`}
      <div class="cell"><label class="drop"><span class="thumb">+</span><span>${i.artwork.length ? "Add revised artwork" : "Add artwork"}</span><input type="file" data-up="artwork" data-item="${i.id}"></label></div>
    </div>`).join("")}

    ${EDITING === "new" ? `<div class="group">${editor({ id: "new", product: ME.products[0].name, qty: 1, design: "" })}</div>` : `<button class="btn ghost addline" data-edit="new">Add Another Tray</button>`}

    <div class="gtitle">Shipping label</div>
    <div class="group">
      ${o.labels.slice().reverse().map(fileRow).join("") || `<div class="cell warn" style="margin:0">No label yet</div>`}
      <div class="cell"><label class="drop"><span class="thumb">+</span><span>${o.labels.length ? "Add another label" : "Add shipping label"}</span><input type="file" data-up="label" accept="application/pdf,image/*"></label></div>
    </div>

    <div class="gtitle">Details</div>
    <div class="group">
      <div class="cell"><label>Due date</label><input type="date" id="eDue" value="${esc(o.due_date || "")}"></div>
      <div class="cell"><label>Notes</label><textarea id="eNotes">${esc(o.notes || "")}</textarea></div>
      <div class="cell"><div class="row"><span>Total</span><strong>${money(o.total)}</strong></div></div>
    </div>
    <button class="btn ghost" id="saveEdit" style="margin:-8px 0 26px">Save Changes</button>

    <div class="gtitle">Messages and history</div>
    <div class="group">
      ${o.history.map(h => `<div class="hist"><div class="when">${esc(h.who)} · ${fmtWhen(h.at)}${h.action !== "Message" ? " · " + esc(h.action) : ""}</div>${h.detail ? `<div class="msg">${esc(h.detail)}</div>` : ""}</div>`).join("")}
      <div class="cell"><textarea id="msg" placeholder="Write a message about this order"></textarea></div>
    </div>
    <button class="btn" id="sendMsg">Send Message</button>
    <p class="meta" style="margin-top:22px">Placed ${fmtWhen(o.created_at)}. Records are never deleted; every change is kept in the history above.</p>`;
}
$("#dBody").addEventListener("change", async e => {
  const inp = e.target; if (!inp.dataset.up || !inp.files.length) return;
  const fd = new FormData(); fd.append("kind", inp.dataset.up); if (inp.dataset.item) fd.append("item_id", inp.dataset.item);
  for (const f of inp.files) fd.append("file", f);
  toast("Uploading…");
  try { await api(`/api/orders/${CUR.id}/files`, { method: "POST", body: fd }); toast("Uploaded"); await openDetail(CUR.id); load(); }
  catch (err) { toast(err.message); }
});
$("#dBody").addEventListener("click", async e => {
  const t = e.target;
  try {
    if (t.dataset.edit) { EDITING = t.dataset.edit === "new" ? "new" : +t.dataset.edit; drawDetail(); return; }
    if (t.dataset.canceledit !== undefined) { EDITING = null; drawDetail(); return; }
    if (t.dataset.saveitem) {
      const box = t.closest(".editor");
      const body = { product: $(".ed-product", box).value, qty: $(".ed-qty", box).value, design: $(".ed-design", box).value };
      if (t.dataset.saveitem !== "new") body.item_id = +t.dataset.saveitem;
      await api(`/api/orders/${CUR.id}/items`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      EDITING = null; toast("Trays updated"); await openDetail(CUR.id); load(); return;
    }
    if (t.dataset.stage) { await api(`/api/orders/${CUR.id}/stage`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ stage: t.dataset.stage }) }); toast("Status updated"); await openDetail(CUR.id); load(); }
    if (t.id === "saveEdit") { await api(`/api/orders/${CUR.id}/edit`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ due_date: $("#eDue").value, notes: $("#eNotes").value }) }); toast("Saved"); await openDetail(CUR.id); load(); }
    if (t.id === "sendMsg") { const text = $("#msg").value.trim(); if (!text) return; await api(`/api/orders/${CUR.id}/message`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) }); toast("Message sent"); await openDetail(CUR.id); }
  } catch (err) { toast(err.message); }
});

boot().catch(showLogin);
</script>
</body>
</html>
